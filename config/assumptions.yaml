# GROUNDED NO MORE — assumption register (single source of truth for every
# configurable parameter). Every entry carries a provenance tag:
#   REAL      – sourced from a public, cited dataset
#   DERIVED   – computed in this repo from REAL / SIMULATED data
#   ASSUMED   – a planning assumption chosen by the author (with rationale)
#   SIMULATED – produced by the synthetic generator
# The airline "Falcon Hub Airways (fictional)" does not exist. None of these
# values are measured aviation reliability or any operator's data.
#
# Ranges are sampled per part by the generator with WORLD_SEED. Values are
# configurable; sensitivity tests vary the starred (*) ones.

meta:
  airline_name: "Falcon Hub Airways (fictional)"
  currency: AED
  time_unit: hour
  timezone: UTC          # simulated clock; hub local time = UTC+4 shown in UI only
  version: 1

calendar:
  epoch: "2023-01-02T00:00:00Z"      # Monday; simulated calendar, not real dates
  history_weeks: [0, 103]            # inclusive; 104 weeks of "airline history"
  train_weeks: [0, 77]               # forecasting model fitting
  selection_weeks: [78, 103]         # forecasting model selection (rolling origins)
  evaluation_weeks: [104, 155]       # 52-week evaluation horizon (holdout)
  warmup_weeks: 26                   # policy runs start at week 78 (scenarios cover 78–155), KPIs from 104
  rolling_origin_step_weeks: 4
  forecast_horizon_weeks: 4
  provenance: ASSUMED
  rationale: "Two years of history mirrors what a materials planner typically has in an MRO/ERP system for sparse-demand parts; the final 26 weeks of history are reserved for model selection so the 52-week horizon remains untouched until freeze."

seeds:
  world_seed: 2023                   # master data + hidden ground truth
  history_seed: 7                    # the airline's realised history (+ forecast-holdout continuation)
  selection_seeds: [100, 119]        # inclusive; policy tuning + frontier candidate selection
  holdout_seeds: [2000, 2019]        # v2: fresh seeds (1000–1019 retired after the v1 holdout; D012). Run ONCE after the v2 freeze
  provenance: ASSUMED

fleet:
  narrowbody:
    archetype: "A320-family archetype (generic single-aisle)"
    count: 24
    tail_prefix: "A6-FH"             # fictional registrations, marked fictional in UI
    fh_per_day: {mean: 10.5, sd: 1.0}
    fc_per_day: {mean: 4.2, sd: 0.5}
    provenance: ASSUMED
    rationale: "Short/medium-haul single-aisle utilisation of ~10–11 block hours and ~4 cycles a day is typical of hub-and-spoke operations (order-of-magnitude, not operator data)."
  widebody:
    archetype: "787-family archetype (generic twin-aisle)"
    count: 16
    tail_prefix: "A6-FW"
    fh_per_day: {mean: 14.0, sd: 1.2}
    fc_per_day: {mean: 2.4, sd: 0.3}   # set to the generated schedule (AUH–LHR/FRA/BOM/SIN mix ≈ 5.6 FH/leg); FH unchanged
    provenance: ASSUMED
    rationale: "Long-haul twin-aisle aircraft fly more hours and far fewer cycles per day."
  seasonality:                       # multiplicative factors on utilisation
    weekly: [1.00, 0.96, 0.97, 1.02, 1.05, 1.03, 0.97]   # Mon..Sun
    monthly: [1.02, 0.95, 0.97, 1.00, 0.98, 1.06, 1.12, 1.12, 0.97, 0.98, 0.99, 1.08]
    holiday_peaks_weeks_of_year: [14, 15, 25, 26, 51, 52]
    holiday_factor: 1.06
    provenance: ASSUMED
    rationale: "Summer (Jul–Aug) and year-end holiday peaks are typical for a Gulf hub; factors are illustrative."
  exposure_feedback: false
  exposure_feedback_rationale: "Grounding does not reduce scheduled exposure (protection via spare aircraft / sub-charter assumed). Lost flying is costed through the AOG penalty. Keeps exogenous demand identical across policies for paired comparison."

network:
  hub: AUH
  outstations: [LHR, FRA, CAI, JED, BOM, SIN]
  stations:                          # coordinates verified against OurAirports (public domain) by sim-engine; see data/source_manifest.csv
    AUH: {name: "Abu Dhabi International", lat: 24.4330, lon: 54.6511, role: hub}
    LHR: {name: "London Heathrow", lat: 51.4706, lon: -0.4619, role: outstation}
    FRA: {name: "Frankfurt am Main", lat: 50.0267, lon: 8.5584, role: outstation}
    CAI: {name: "Cairo International", lat: 30.1115, lon: 31.3967, role: outstation}
    JED: {name: "King Abdulaziz International, Jeddah", lat: 21.6796, lon: 39.1565, role: outstation}
    BOM: {name: "Chhatrapati Shivaji Maharaj International, Mumbai", lat: 19.0887, lon: 72.8679, role: outstation}
    SIN: {name: "Singapore Changi", lat: 1.3502, lon: 103.9940, role: outstation}
  stations_provenance: REAL
  route_mix:                         # share of each archetype's rotations to each outstation
    narrowbody: {CAI: 0.30, JED: 0.35, BOM: 0.35}
    widebody: {LHR: 0.30, FRA: 0.25, BOM: 0.15, SIN: 0.30}
    provenance: ASSUMED
  aog_transport_hours:               # next-flight-out / hand-carry incl. handling + customs (AUH -> station); symmetric
    AUH: {AUH: 0, LHR: 16, FRA: 14, CAI: 11, JED: 9, BOM: 9, SIN: 13}
    LHR: {LHR: 0, FRA: 8, CAI: 18, JED: 22, BOM: 26, SIN: 28}
    FRA: {FRA: 0, CAI: 16, JED: 20, BOM: 24, SIN: 26}
    CAI: {CAI: 0, JED: 10, BOM: 22, SIN: 26}
    JED: {JED: 0, BOM: 20, SIN: 24}
    BOM: {BOM: 0, SIN: 14}
    SIN: {SIN: 0}
    provenance: ASSUMED
    rationale: "Station-to-station AOG times include waiting for the next suitable flight, handling and customs; outstation-to-outstation usually routes via the hub."
  routine_transport_days: {mean: 4.0, sd: 1.0}   # hub -> outstation scheduled replenishment
  routine_transport_days_provenance: ASSUMED
  removed_unit_return_days: {mean: 5.0, sd: 1.5} # outstation -> AUH for unserviceable cores
  removed_unit_return_days_provenance: ASSUMED

parts:
  counts: {consumable: 45, expendable: 35, rotable: 40}
  pn_format: "GN-<ATA>-<C|E|R><nnn>"
  catalogue: config/part_catalogue.csv   # (v2) hand-curated PN list: class, ATA, description, family, type applicability, QPA, deadline class, removal mode, driver
  ata_chapters:
    "20": "Standard practices – airframe"
    "21": "Air conditioning & pressurisation"
    "24": "Electrical power"
    "27": "Flight controls"
    "29": "Hydraulic power"
    "32": "Landing gear"
    "34": "Navigation"
    "36": "Pneumatic"
    "49": "Airborne auxiliary power (APU)"
    "28": "Fuel"
    "30": "Ice & rain protection"
    "33": "Lights"
    "35": "Oxygen"
    "38": "Water & waste"
  unit_cost_aed:                     # (v1 envelope; v2 draws unit cost by description family, see generator.families) *
    consumable: [20, 500]
    expendable: [500, 15000]
    rotable: [15000, 500000]
  lead_time_days:                    # purchase lead time mean drawn uniform in range; cv per part
    consumable: [7, 45]
    expendable: [14, 90]
    rotable: [30, 180]
    cv: [0.15, 0.45]
  repair_tat_days: [15, 90]          # mean shop TAT (excl. transport, excl. queue) *
  repair_tat_cv: [0.20, 0.50]
  repair_cost_pct_of_unit: [0.08, 0.25]
  condemnation_prob: [0.01, 0.08]
  # (v2) qty per aircraft is hand-set per PN in config/part_catalogue.csv (AV-17)
  mtbur_fh: [4000, 40000]            # rotables & expendables driven by FH (true value hidden; see ground truth)
  mtbur_fc: [2500, 25000]            # for cycle-driven parts (landing gear, brakes, doors, APU starts)
  quoted_mtbur_noise_sd_log: 0.20    # (v2 V1, was 0.35) vendor-quoted MTBUR deviates from truth (lognormal): quotes moderately noisy
  quoted_mtbur_optimism: 1.10        # (v2 V1, was 1.25) vendor quotes moderately optimistic: ~10% higher MTBUR on average
  overdispersion:                    # negative-binomial clustering for some parts (k = shape; var = mu + mu^2/k)
    share_of_parts: 0.30
    k_range: [0.6, 3.0]
  consumable_usage_per_1000_fc: [0.5, 40]    # line-maintenance usage of consumables (Poisson/NB)
  scheduled_kit_share_consumable: 0.5        # share of consumable PNs also consumed by scheduled task kits
  shelf_life:
    share_of_consumables: 0.25
    months: [12, 36]
  # (v2) deadline classes are assigned per PN AFTER the description, in config/part_catalogue.csv (AV-05):
  #   D0 only where no plausible MEL relief exists (wheels/tyres, brakes, flight-control servo controls/PCUs,
  #   nose wheel steering, flight deck windshield, crew oxygen mask); D3/D10 for APU items, single bleed valve,
  #   single fuel boost pump, single pack/ACM, IDG, weather radar, etc.; no D0 on consumables; NONE for servicing fluids.
  provenance: ASSUMED
  rationale: "Ranges reflect order-of-magnitude aviation materials practice (consumables cheap and fast, rotables expensive and repairable with long lead times). Values are illustrative and configurable; no OEM or operator data is used."

deadline_classes:
  D0: {hours: 0, label: "Rectification window (hypothetical): none – needed before next departure", note: "Aircraft grounded until fitted"}
  D3: {hours: 72, label: "Rectification window (hypothetical): 72 h"}
  D10: {hours: 240, label: "Rectification window (hypothetical): 240 h"}
  NONE: {hours: null, label: "No rectification window (servicing fluid; line usage only, never an AOG driver)"}
  provenance: ASSUMED
  disclaimer: "D3/D10 are simplified analogues of MEL repair-interval categories B and C, not operator MEL decisions. They are applied generically per PN (elapsed hours, not calendar days excluding the day of discovery) and do not represent an approved MEL; the real go/no-go depends on the MEL item and the redundancy remaining."

maintenance:
  scheduled_checks:                  # scheduled task demand known in advance -> kits
    A_check_interval_fh: {narrowbody: 750, widebody: 1000}
    A_check_station: AUH
    kit_lines_per_check: [6, 14]
    kit_notice_days: 21
  provenance: ASSUMED

repair_shops:
  AUH_INHOUSE: {location: AUH, capacity_slots: 6, atas: ["21", "24", "29", "36", "33", "35", "38"]}
  EU_VENDOR:   {location: FRA, capacity_slots: 8, atas: ["27", "32", "34", "49", "28", "30"]}
  vendor_transit_days_from_auh: {AUH_INHOUSE: 0, EU_VENDOR: 4}
  provenance: ASSUMED
  rationale: "A hub in-house shop for simpler LRUs and an external vendor for flight controls, landing gear, avionics and APU components; finite parallel capacity creates queueing."

economics:
  carrying_cost_pct_per_year: 0.20   # * range 0.15–0.25
  carrying_cost_range: [0.15, 0.25]
  emergency_logistics_aed: [2000, 15000]     # per AOG shipment, scaled by distance
  routine_shipment_aed_per_line: 150
  expedite_purchase_premium_pct: 0.15   # (v1 only; the v2 engine has no outright AOG buy — kept until downstream v2 rebuild)
  repair_acceleration_cost_aed_per_day_per_unit: 400   # paying a vendor to cut TAT
  aog_penalty_aed_per_hour:          # * scenario value for decision-making, sensitivity-tested
    narrowbody: 15000
    widebody: 30000
  aog_penalty_sensitivity: [0.5, 1.0, 2.0]   # applies to the per-hour rate
  aog_event_cost_aed:                # (v2, AV-10) fixed disruption cost per merged AOG event (tail swap / delay handling / re-accommodation)
    narrowbody: 40000
    widebody: 100000
  aog_hour_definition: "Material AOG hour = clock hours from need (or end of the rectification window) to release to service, including fitting/RTS time, counted only when the part was not available in time."
  fitting_labour_aed_per_hour: 400   # (v2) technician labour for fitting/robbery
  provenance: ASSUMED
  rationale: "AOG cost per hour is a planning scenario (lost revenue, re-accommodation, crew, sub-charter) — highly operator-specific, hence sensitivity tested. Capital tied up in spares is reported separately from annual operating costs."

service_targets:                     # target cycle service level by deadline class (P1/P2)
  D0: 0.97
  D3: 0.92
  D10: 0.85
  provenance: ASSUMED

policy_baseline_P0:                  # (v2, AV-04) "OEM-recommended provisioning on quoted data"
  rotable_protection_level: {D0: 0.95, D3: 0.90, D10: 0.90}
  rotable_float_rule: "total spares S = smallest S with P(Poisson(quoted annual removals x quoted pipeline days / 365) <= S - 1) >= protection level (95% D0, 90% D3/D10), i.e. the protection level is the probability that a demand finds a spare on the shelf (V2-SIM-10); quoted pipeline = quoted shop TAT + quoted vendor transit both ways + quoted core return weighted by the share rectified at an outstation (D0 50%, D3/D10 per the hub-deferral practice, wear-planned 0) (V2-SIM-11). Held at AUH (serviceable target = S minus the repair-loop units the run starts with), plus 1 outstation unit (line-station kit) for a D0 PN where the quoted station rate >= 4/yr."
  rotable_outstation_min_quoted_removals_per_year: 4
  consumable_min_weeks_of_avg_demand: {C: 26, E: 13}
  consumable_max_multiple_of_min: 2.0
  cs_rule: "C/E: generous static min/max from quoted rates: min = 26 weeks (C) / 13 weeks (E) of average quoted demand, max = 2 x min, at every station that sees quoted demand (AUH sized on network demand); no deadline-class differentiation"
  naive_rule: "P0-naive (illustration only, not a policy in the comparison): v1 rule, rotable float = ceil(quoted annual removals x quoted shop TAT / 365), C/E min = 6 weeks"
  naive_consumable_min_weeks_of_avg_demand: 6
  provenance: ASSUMED
  rationale: "Even an unsophisticated airline sizes rotables with a Poisson protection level on OEM/vendor quoted reliability (Spec 2000-style initial provisioning at 90-95%) and keeps generous min/max on C-class. P0 is therefore competent-but-static: it trusts quoted MTBUR/TAT, ignores variability beyond Poisson and never re-plans from history."

pool_exchange_P3:                    # Tier 3 stretch
  response_hours: 24
  fee_pct_of_unit: 0.08
  core_return_days: 10
  annual_access_fee_aed: 250000
  capacity_per_month: 6
  provenance: ASSUMED

planted_situations:                  # documented demo situations (generator implements; see data/ground_truth)
  provenance: SIMULATED
  items:
    - id: PS1
      description: "Understocked unscheduled D0 LRU at BOM (type-specific; legacy provisioning holds no line-station unit there because the optimistic quoted rate at BOM is < 4/yr)"
    - id: PS2
      description: "Long-TAT rotable with an overdue repair order at the EU vendor"
    - id: PS3
      description: "Declining-demand consumable creating excess stock"
    - id: PS4
      description: "Lead-time jump on one expendable (supplier change) during history week ~70"

# ---- added by sim-engine (compatible extension; see docs/agent_notes/sim-engine.md) ----
generator:                           # parameters of the synthetic generator not covered above
  airborne_speed_kmh: {narrowbody: 830, widebody: 870}   # great-circle distance / speed = flight hours (FH)
  route_distance_factor: 1.05        # airway routing vs great circle
  taxi_hours_per_leg: 0.4            # block time = FH + taxi
  min_ground_hours: 1.0              # minimum turnaround
  ground_time_jitter: 0.20           # +/- uniform share on turnaround time
  a_check_downtime_h: 12             # A-check performed overnight at AUH
  kit_line_qty: [1, 4]               # quantity per kit line (consumables)
  families:                          # (v2, AV-16/19) unit cost (log-uniform AED) and no-fault-found share by description family; optional MTBUR range overrides for high-QPA items
    avionics_lru: {cost_aed: [80000, 450000], nff_share: 0.35}
    flight_computer: {cost_aed: [150000, 500000], nff_share: 0.40}
    servo_actuator: {cost_aed: [60000, 300000], nff_share: 0.10, mtbur_fh: [15000, 60000]}
    valve: {cost_aed: [25000, 150000], nff_share: 0.15}
    pump: {cost_aed: [50000, 300000], nff_share: 0.10}
    rotating_machine: {cost_aed: [120000, 450000], nff_share: 0.10}
    power_generation: {cost_aed: [200000, 500000], nff_share: 0.15}
    power_conversion: {cost_aed: [40000, 150000], nff_share: 0.25}
    brake_nb: {cost_aed: [80000, 180000], nff_share: 0.0, mtbur_fc: [1800, 3000]}
    brake_wb: {cost_aed: [150000, 350000], nff_share: 0.0, mtbur_fc: [1800, 3000]}
    wheel_tyre:                      # (v2 A.a data correction) cheap, high-volume repairable assembly rebuilt in a hub wheel & tyre shop
      cost_aed: [15000, 45000]
      nff_share: 0.0
      mtbur_fc: [3000, 8000]
      repair_shop: AUH_INHOUSE       # wheel & tyre shop at the hub (was the EU vendor via the ATA 32 mapping)
      repair_tat_days: [2, 7]        # tyre change/retread + wheel NDT inspection: days, not weeks (was the generic 15-90 d)
      repair_tat_cv: [0.20, 0.40]
      repair_cost_pct_of_unit: [0.15, 0.35]   # new/retreaded tyre + inspection per rebuild
      condemnation_prob: [0.01, 0.03]         # wheel-half scrap at inspection (tyre scrap is inside the rebuild cost)
    probe: {cost_aed: [8000, 35000], nff_share: 0.25}
    sensor: {cost_aed: [800, 9000]}
    valve_small: {cost_aed: [1500, 8000]}
    relay_contactor: {cost_aed: [1500, 12000], mtbur_fh: [40000, 150000]}
    fuel_probe: {cost_aed: [3000, 12000], mtbur_fh: [60000, 200000]}
    electric_motor: {cost_aed: [3000, 15000]}
    windshield: {cost_aed: [60000, 150000], mtbur_fh: [30000, 80000]}
    probe_small: {cost_aed: [8000, 25000]}
    ignition: {cost_aed: [2000, 12000]}
    oxygen_mask: {cost_aed: [800, 3000], mtbur_fh: [400000, 1200000]}
    crew_mask: {cost_aed: [5000, 15000]}
    battery_pack: {cost_aed: [2000, 6000]}
    light: {cost_aed: [1000, 10000]}
    hardware: {cost_aed: [20, 300]}
    seal_kit: {cost_aed: [30, 500]}
    filter: {cost_aed: [60, 900]}
    lamp: {cost_aed: [15, 150]}
    fluid: {cost_aed: [40, 300]}
    fuse: {cost_aed: [15, 80]}
    wiper_blade: {cost_aed: [80, 400]}
  nff_shop_days: [2, 5]              # (v2, AV-19) test-and-release shop time for a no-fault-found unit
  nff_cost_pct_of_repair: 0.15       # NFF test-and-release cost vs a full repair; NFF units never condemn
  wear_planned_notice_days: [5, 10]  # (v2, AV-11) brake changes are known ahead from wear-pin checks and done at the hub
  quoted_tat_noise_sd_log: 0.10      # (v2 V1, was 0.15) contractual shop-TAT quotes are slightly noisy
  quoted_tat_optimism: 0.95          # (v2 V1, was 0.90) contractual TAT quotes slightly biased: ~5% shorter than reality
  quoted_condemn_noise_sd_log: 0.30
  quoted_usage_noise_sd_log: 0.30    # consumables: quoted FC-per-unit vs true
  lead_time_true_noise_sd_log: 0.10  # true lead-time mean vs quoted
  deadline_class_alt_prob: 0.05      # per-event chance a D3 requirement is D10 or vice versa (D0/NONE never change)
  deferred_to_hub_share: 0.92        # D3/D10 removals found at an outstation are mostly deferred and rectified at AUH on the tail's next hub arrival
  variants:                          # calibration sensitivity worlds (scale TRUE MTBUR of R/E only; quoted data unchanged)
    central: {true_mtbur_scale: 1.00}
    low_stress: {true_mtbur_scale: 1.08}    # v2 calibrated (P0 only): AOG end binds first (~1,200 h/yr; rotable fill ~0.84)
    high_stress: {true_mtbur_scale: 0.96}   # v2 calibrated (P0 only): rotable-fill end binds first (~0.78)
  planted:
    PS1: {mtbur_fc: 1300, quoted_multiple: 2.5}   # (v2, AV-11) the catalogue row flagged PS1 (an unscheduled D0 LRU); true vs quoted MTBUR
    PS2: {tat_days: 88, quoted_tat_days: 60, stuck_repair_days: 200, weeks: [84, 92], seed: history}   # the first PS2 removal in the window (history seed only) gets 200 shop work days
    PS3: {trend_per_year: 0.45, quoted_usage_multiple: 1.10}
    PS4: {change_week: 70, lead_time_factor: 2.6}
  provenance: ASSUMED
  rationale: "Schedule geometry (speeds, taxi, turnaround), quote-vs-truth noise and planted-situation magnitudes are illustrative generator settings chosen so that utilisation lands near the fleet means and the planted situations are visible in two years of history."

engine:                              # event-engine settings (policy-agnostic)
  shop_bench_time_share: 0.05        # share of shop work time a unit occupies a capacity slot (bench/test stand)
  condemn_inspection_days: 3         # BER decided after teardown/inspection; slot released then
  expedite_lead_time_factor: 0.5     # (v1 only, UNUSED by the v2 engine; kept until downstream v2 rebuild)
  expedite_max_days: {C: 2, E: 3, R: 5}   # (v1 only, UNUSED by the v2 engine)
  routine_transport_min_days: 1.0    # floor on sampled routine/core-return transit
  deferred_margin_h: 24              # (v2, AV-07) a deferred need ships emergency whenever routine ETA > deadline - margin; AOG routes are triggered by deadline - route time - margin
  fitting_hours: {R: [2, 6], E: 1, C: 1}   # (v2, AV-10) fitting / ops check / release-to-service time added to AOG duration
  provenance: ASSUMED
  rationale: "Shop capacity slots are interpreted as bench/test-stand positions: a unit holds a slot only for its touch/test time (share of work time); awaiting-parts and paperwork time runs outside the slot. Without this, 14 slots could not process ~1,000 rotable removals a year at 15–90 day TATs. 0.05 was chosen in v1 for ~0.8 hub bench utilisation; queueing is light by construction (capacity slots are bench positions)."

calibration_targets:                 # v2 band chosen by the user (before any v2 policy result); NOT yet calibrated or locked
  status: "CALIBRATED (v2) with P0 only; V1 chosen by the user's fewest-changes rule (quote accuracy: quoted_mtbur_optimism 1.10, quoted_mtbur_noise_sd_log 0.20, quoted_tat_optimism 0.95, quoted_tat_noise_sd_log 0.10); AOG-market settings and the line-station kit NOT applied; locked in outputs/freeze/calibration_lock.json"
  rotable_immediate_fill_rate: [0.78, 0.85]   # P0 network rotable immediate fill (all stations)
  aog_hours_per_year: [1200, 2700]            # material AOG, fleet-wide, merged per aircraft (30-68 h per aircraft-year)
  aog_events_per_year: [60, 100]
  sensitivity_variants:              # low/high stress worlds at the band ends (generator.variants scalars NOT set yet)
    low_stress: {aog_hours_per_year: 1200, rotable_immediate_fill_rate: 0.85}
    high_stress: {aog_hours_per_year: 2700, rotable_immediate_fill_rate: 0.78}
  p0_rule: "unchanged: legacy OEM-quote provisioning; line-station unit only for D0 PNs with >= 4 quoted removals/yr at that station"
  provenance: ASSUMED
  rationale: "Legacy OEM-quote provisioning (Poisson 95%/90% on quoted data) with no line-station units for low-volume D0 parts; the legacy line-station rule (>= 4 quoted removals/yr) is kept - P2 is the remedy. Chosen by the user after the v2 P0 gap diagnosis and before any v2 P1/P2/optimiser result."
  v1_band:                           # SIM-CAL (v1), archived reference only
    immediate_fill_rate: [0.93, 0.97]
    rotable_immediate_fill_rate: [0.80, 0.88]
    aog_hours_per_year: [1500, 3500]
    aog_events_per_year: [60, 250]

aog_sourcing:                        # (v2) AOG recovery routes, all ASSUMED; availability/response drawn from paired per-request CRNs
  exchange_loan:                     # AV-03: AOG exchange/loan for rotables (replaces the v1 guaranteed outright buy)
    availability: {narrowbody: 0.85, widebody: 0.50}
    response_hours: {narrowbody: [24, 48], widebody: [48, 120]}
    fee_pct_of_list: {narrowbody: 0.20, widebody: 0.30}     # exchange/AOG handling fee at activation
    loan_fee_pct_of_list_per_day: 0.003                     # while the borrowed unit is fitted (until our own unit replaces it)
  local_borrow:                      # AV-15: outstation third-party loan / inter-airline borrow for rotables
    availability:
      narrowbody: {LHR: 0.60, FRA: 0.60, SIN: 0.55, BOM: 0.35, CAI: 0.30, JED: 0.30}
      widebody: {LHR: 0.35, FRA: 0.35, SIN: 0.30, BOM: 0.15, CAI: 0.10, JED: 0.10}
