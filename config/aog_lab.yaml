# AOG Response Lab + Planner Action Centre parameters (gnm.aog), v2.
# config/assumptions.yaml stays the single source for shared economics, transport times, AOG
# sourcing routes (aog_sourcing), fitting times and pool terms; this file only holds rules specific
# to the AOG lab and the exception generator. Every entry carries a provenance tag and a rationale.
# All values are ASSUMED planning rules for the fictional "Falcon Hub Airways (fictional)".

history:
  weeks: [0, 103]
  provenance: ASSUMED
  rationale: "Only the realised v2 history (weeks 0-103, P0) is read. The holdout is never opened."

protection_level:                   # lateral donor rule
  service_level: 0.95
  lookback_weeks: 52
  resupply_hours_source: "network.routine_transport_days.mean (assumptions.yaml)"
  provenance: ASSUMED
  rationale: "A donor outstation keeps enough serviceable units for its OWN D0 demand while it waits for routine resupply from AUH: protection level = smallest n with P(Poisson(lambda x L) <= n - 1) >= 0.95 (fill-rate form), lambda = the donor's D0 requests for the PN in the trailing 52 weeks before the request, L = mean routine transport (96 h). Any D0 demand protects at least 1; more than ~4.7 D0 requests a year protects 2."

routine_option:
  slack_sd: 2.0
  provenance: ASSUMED
  rationale: "Mirrors the v2 engine rule (AV-07): a transfer for a deferred need ships routine only if the routine ETA meets deadline - engine.deferred_margin_h. The lab cannot know the drawn ETA, so it plans with mean + 2 sd routine transit (144 h) + the 24 h margin = 168 h of slack; D10 ships routine, D3 next-flight-out."

probabilistic_routes:
  expected_wait: "routes tried in the engine's order within one attempt; E[wait] = E[response | success in the cycle] + retry_hours x P(cycle fails) / P(cycle succeeds)"
  provenance: ASSUMED
  rationale: "Local borrow, robbery, exchange/loan and local buy are available only with probability p (aog_sourcing in assumptions.yaml) and a failed attempt is retried every aog_sourcing.retry_hours (V2-SIM-14). The desk cannot know the per-request draw, so the lab values each route by its expected wait and cost. 'Local borrow' (outstations) and 'robbery' (AUH) carry exchange/loan as the same-attempt fall-back, exactly the engine's order; 'exchange/loan' alone is the desk going straight to the market. First-attempt odds, response range, cycle success probability and the share won by the first route are shown alongside."

loan_duration:
  rule: "until the first own unit is expected (the 'await inbound supply' estimate); if none is inbound, quoted shop TAT + shop transit + AUH -> station leg"
  provenance: ASSUMED
  rationale: "A borrowed or exchange-loan unit stays fitted, accruing its daily fee, until the airline's own serviceable unit replaces it (V2-SIM-5). The lab estimates that date from supply already in the pipeline at request time."

inbound:
  overdue_assumed_remaining_days: 7
  provenance: ASSUMED
  rationale: "An open PO or RO already past its quoted date has an unknown remaining time; 7 days is assumed when valuing 'await inbound supply'."

repair_queue_jump:                  # AV-21
  surcharge_pct_of_repair_cost: 0.20
  surcharge_range: [0.10, 0.25]
  provenance: ASSUMED
  rationale: "AOG priority at a shop moves the unit to the front of the queue but does not shorten the work content (AV-21). Only an RO that has reached the shop and has not started work (start_h unknown or after the request time) can jump the queue. Estimated return = request time + quoted shop TAT + shop -> AUH transit, then the AUH -> station leg. Cost = a flat AOG handling surcharge of 20% of the repair cost (range 10-25%). Shown as an ESTIMATE; feasible only if faster than every other feasible option. The v2 shop queue is light (bench-slot model), so this option rarely helps."

robbery:
  rank_as_recommendation: false
  provenance: ASSUMED
  rationale: "Robbery (AUH only in the engine) is always shown as 'engineering/quality approval required — human decision' with its odds, response and labour cost, but never auto-ranked as the recommendation: it moves the shortage to the donor aircraft and needs approvals a model cannot give."

pool_exchange:
  contracted: false
  scope_part_classes: ["R"]
  provenance: ASSUMED
  rationale: "P0 has no pool-exchange agreement; the P3 terms are shown greyed with reason NOT_CONTRACTED. No pool growth."

counterfactual:
  replan_at_quoted_due: true
  provenance: ASSUMED
  rationale: "Ex-post scoring of the 'await inbound supply' option: if the awaited unit has not arrived by its quoted date, the desk escalates to the best AOG route (expected wait) at that moment."

showcase:
  n: 12
  provenance: ASSUMED
  rationale: "About a dozen incidents fit a walk-through; picked deterministically (forced cases + greedy coverage of station, rectification window, part class, route taken and duration)."

actions:
  as_of_week: 103
  kit_horizon_weeks: 3
  kit_urgent_within_weeks: 1
  overdue_urgent_weeks: 4
  depletion_service_level: 0.95
  depletion_lookback_weeks: 52
  decline_window_weeks: 52
  decline_ratio: 0.75
  excess_cover_weeks: 26
  expiry_cover_share_of_shelf_life: 0.5
  lead_drift_lookback_weeks: 34
  lead_drift_min_pos: 2
  lead_drift_review_ratio: 1.5
  lead_drift_urgent_ratio: 2.0
  loan_urgent_days: 14
  donor_urgent_days: 7
  provenance: ASSUMED
  rationale: "Planner exception thresholds for exception types the v2 simulation produces. Kits are checked 3 weeks ahead (21-day notice). An RO more than 4 weeks past quoted due is urgent. Declining demand = last 52 weeks below 75% of the previous 52 (year over year, so gradual trends are caught; a 26/26 split missed the slow decline of the planted consumable) with more than 26 weeks of network cover at the recent rate; expiry risk when cover exceeds half the shelf life. Lead-time drift = mean realised/quoted lead of POs received or open past due in the last 34 weeks >= 1.5 (urgent >= 2.0), at least 2 POs. A borrowed unit fitted longer than 14 days, or a robbed donor not reinstated after 7 days, is urgent. No simulated documentation exceptions (the simulation has no document data)."
