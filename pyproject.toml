[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnm"
version = "0.1.0"
description = "GROUNDED NO MORE — aviation spare-parts intelligence (independent educational simulation)"
requires-python = ">=3.11"
license = "MIT"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running simulation tests", "browser: Playwright tests", "v1_outputs: depends on v1 outputs/exports (skipped until v2 regeneration)"]
addopts = "-q"
